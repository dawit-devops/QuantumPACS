########## dcm4chee archive connection used by weasis-pacs-connector ##########
# Key names must match the connector's bundled dicom-dcm4chee-arc.properties
# (arc.* family). The connector runs inside the same WildFly as the archive,
# so localhost:11112 is the archive's own DICOM listener.

# ID of the archive (mandatory).
arc.id=1000

# Query the archive automatically; with arc.activate=false the caller must
# pass ?archive=1000 explicitly.
arc.activate=true

# AET, hostname and port of the archive (mandatory).
arc.aet=DCM4CHEE
arc.host=localhost
arc.port=11112

# Base URL of the WADO server. ${server.base.url} resolves to the scheme/host/
# port the browser used when calling the connector (8082 on the host).
arc.wado.url=${server.base.url}/dcm4chee-arc/aets/${arc.aet}/wado

# Accept all transfer syntaxes on WADO-URI (otherwise arc-light uncompresses).
wado.addparams=&transferSyntax=*
