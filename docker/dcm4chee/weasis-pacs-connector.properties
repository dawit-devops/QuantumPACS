########## weasis-pacs-connector 8.0.0 configuration ##########
# Copied into the WildFly standalone/configuration/ by the dcm4chee-arc
# entrypoint (docker-entrypoint.d/configuration -> standalone/configuration).
# Key names must match the connector's defaults (see src/main/resources/ in
# nroduit/weasis-pacs-connector) — unknown keys silently shadow the bundled
# defaults and break launch (studyUID not in request.ids etc.).

# DICOM AETitle the connector uses for manifest C-FIND against the archive.
aet=PACS-CONNECTOR

# Build the xml manifest even if no image has been found.
accept.noimage=false

# Manifest builder threads / cleanup.
thread.manifest.concurrency=5
thread.max.life.clyle=300000
thread.clean.frequency=60000

# Request IDs allowed: patientID, studyUID, accessionNumber, seriesUID, objectUID.
# studyUID is what QuantumPACS uses for "Open in Weasis" (ADR-028).
request.ids=patientID,studyUID,accessionNumber,seriesUID,objectUID

# Request levels allowed of the IHE IID profile: PATIENT, STUDY.
request.IID.level=PATIENT,STUDY

# Comma-separated IPs/hostnames allowed to call the connector. Empty = any.
# Production: restrict to the QuantumPACS frontend host(s) (ADR-028 R13).
hosts.allow=

# Archive config file(s) to load from the classpath (jboss.server.config.dir).
# MUST be present — without it the connector activates no archive and the
# manifest C-FIND returns "Empty patient list" (manifest 404 in Weasis).
arc.config.list=dicom-dcm4chee-arc.properties
