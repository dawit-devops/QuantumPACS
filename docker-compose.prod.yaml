services:
  postgres:
    image: postgres:18-alpine
    container_name: quantumpacs-postgres-prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantumpacs
      # D-M5: never ship defaults — fail fast if the operator forgot .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no default is ever used in production}
      POSTGRES_DB: quantumpacs
    volumes:
      # PG18+ single-mount convention (see docker-compose.yaml).
      # WARNING: pre-18 volumes (old /var/lib/postgresql/data layout) will
      # NOT start under postgres:18 — migrate via pg_dump/restore or
      # pg_upgrade BEFORE switching, and never reuse the old volume here.
      - quantumpacs_pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumpacs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Versioned tags only — IMAGE_TAG is required (e.g. a git commit sha),
    # so 'latest' can never be deployed here.
    image: quantumpacs-backend:${IMAGE_TAG:?Set IMAGE_TAG (e.g. $(git rev-parse --short HEAD)) — 'latest' is never allowed in production}
    container_name: quantumpacs-backend-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QUANTUMPACS_DOCKER: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: quantumpacs
      DB_USER: quantumpacs
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?Set SECRET in .env — known/committed values are refused by assert_production_secret}
      SUPERADMIN_PASS: ${SUPERADMIN_PASS:?Set SUPERADMIN_PASS in .env — the committed default is refused}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quantumpacs-frontend:${IMAGE_TAG:?Set IMAGE_TAG (e.g. $(git rev-parse --short HEAD)) — 'latest' is never allowed in production}
    container_name: quantumpacs-frontend-prod
    restart: unless-stopped
    # nginx-unprivileged listens on 8080 inside the container.
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  # Fresh name (18 suffix): a leftover pre-18 volume must never be picked
  # up silently — the postgres:18 entrypoint would refuse to boot on it.
  quantumpacs_pgdata18:
