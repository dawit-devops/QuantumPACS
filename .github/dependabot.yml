version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      react:
        patterns:
          - "react*"
          - "react-dom*"
      cornerstone:
        patterns:
          - "cornerstone*"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
      ant-design:
        patterns:
          - "@ant-design/*"
          - "antd"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      aws:
        patterns:
          - "aiobotocore"
      dicom:
        patterns:
          - "pydicom"
          - "pynetdicom"
      async:
        patterns:
          - "uvicorn"
          - "gunicorn"
          - "asyncpg"
          - "aiofiles"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
