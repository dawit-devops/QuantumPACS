name: CI
on: [push, pull_request]

# One pipeline per ref: supersede stale runs when a PR gets new commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install ruff==0.6.0
      - run: ruff check backend/
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx prettier --check src/
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx tsc --noEmit
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: quantumpacs_test, POSTGRES_USER: quantumpacs, POSTGRES_PASSWORD: pa55w0rd }
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install -r backend/requirements.txt && pip install pytest pytest-asyncio httpx
      - run: cd backend && python -m pytest tests/ -v --ignore=tests/integration
        env: { DB_HOST: localhost, DB_PORT: 5432 }
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx vitest run
  build-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - run: cd frontend && node scripts/check-bundle-size.mjs
      - run: cd frontend && npx vitest run --coverage
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantumpacs-backend backend/
      - run: docker build -t quantumpacs-frontend frontend/
  # (D-M11) The compose stack is the prod-like runtime (the QUANTUMPACS_DOCKER
  # config branch); smoke-test it end-to-end so the images actually run.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
        env:
          SECRET: quantumpacs-ci-smoke-secret-not-for-any-prod
      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then
              echo "backend healthy (attempt $i)"
              curl -sf http://localhost:8080/api/health
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose logs --tail 100 backend postgres elasticsearch redis
          exit 1
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$code" = "200" ]; then
              echo "frontend serving (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "frontend never served" >&2
          exit 1
      - run: docker compose down -v
  # (D-H3) E2E runs against the real deployment topology: the compose nginx
  # container serves the built SPA on :5173 and proxies /api to the backend.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Boot stack
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "backend healthy (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose logs --tail 100 backend postgres elasticsearch redis
          exit 1
        env:
          SECRET: quantumpacs-ci-e2e-secret-not-for-any-prod
      - name: Run Playwright
        run: cd frontend && npx playwright test
      - name: Upload trace artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: Teardown
        if: always()
        run: docker compose down -v
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned action tag (not @master); fs scan covers both backend and
      # frontend; fail on HIGH/CRITICAL findings.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'true'
          scanners: 'vuln'
