name: CI

# PRs already run the full suite, so direct pushes only need coverage on the
# integration/production branches — running on phase/** pushed twice per PR.
on:
  push:
    branches: [main, v3-dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install ruff==0.6.0
      - run: ruff check backend/
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci && npx prettier --check src/
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci && npx tsc --noEmit
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: quantumpacs_test, POSTGRES_USER: quantumpacs, POSTGRES_PASSWORD: pa55w0rd }
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install -r backend/requirements.txt && pip install pytest pytest-asyncio httpx
      # Integration tests use testcontainers (postgres:16-alpine) which can
      # pull its own image, so the suite runs fully in CI.
      # M4: the backend suite now enforces a coverage floor via
      # --cov-fail-under (matches [tool.coverage.report] fail_under).
      - run: cd backend && python -m pytest tests/ -v --cov --cov-report=term-missing:skip-covered
        env: { DB_HOST: localhost, DB_PORT: 5432 }
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # M4: coverage thresholds live in vite.config.js and now gate PRs here
      # (previously only the build-gate job ran --coverage).
      - run: cd frontend && npm ci && npx vitest run --coverage
  e2e:
    # Playwright against the real stack: postgres + redis + backend + a
    # production build served by vite preview (the playwright webServer block
    # starts/waits for it). Runs the deterministic chromium project only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: quantumpacs_e2e, POSTGRES_USER: quantumpacs, POSTGRES_PASSWORD: quantumpacs-ci-e2e-db-pass }
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: quantumpacs_e2e
      DB_USER: quantumpacs
      DB_PASSWORD: quantumpacs-ci-e2e-db-pass
      SECRET: quantumpacs-ci-e2e-secret-not-for-any-prod
      SUPERADMIN_PASS: quantumpacs-ci-e2e-superadmin-not-for-any-prod
      QUANTUMPACS_DOCKER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install -r backend/requirements.txt
      - name: Init DB + seed roles
        run: |
          cd backend
          python -m alembic upgrade head
          python -m management.seed_rbac
      # Admin specs read E2E_ADMIN_PASS (helpers.ts / LoginPage.ts). GitHub
      # Actions env blocks cannot reference sibling entries, so export it from
      # SUPERADMIN_PASS — the backend seeds admin with the same value.
      - name: Wire E2E admin password
        run: echo "E2E_ADMIN_PASS=$SUPERADMIN_PASS" >> "$GITHUB_ENV"
      # Real-role specs (real-role-login, worklist-flow) log in as
      # test.technologist; the seeder refuses docker envs by default and needs
      # the explicit --allow-docker opt-in. Idempotent (ON CONFLICT DO UPDATE).
      - name: Seed test users (real-role e2e specs)
        run: |
          cd backend
          python seed_test_users.py --allow-docker
      # M9: portal-share.spec.ts needs at least one file record to share; the
      # dev DB has none, so the e2e job inserts a fixture row (idempotent by
      # SOPInstanceUID) before the specs run.
      - name: Seed e2e fixture file
        run: |
          cd backend
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          DSN = (
              f"postgresql://{os.environ['DB_USER']}:{os.environ['DB_PASSWORD']}"
              f"@{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/{os.environ['DB_NAME']}"
          )

          async def main():
              conn = await asyncpg.connect(DSN)
              try:
                  sop = "1.2.826.0.1.3680043.8.498.20260810-e2e-fixture-001"
                  existing = await conn.fetchval(
                      "SELECT id FROM files WHERE sop_instance_uid = $1", sop
                  )
                  if existing:
                      print(f"fixture file already present (id={existing})")
                      return
                  pid = await conn.fetchval(
                      "INSERT INTO patients (patient_id, name, birth_date, sex) "
                      "VALUES ('E2E-FIXTURE-001', 'E2E^Fixture Patient', "
                      "'19800101', 'O') ON CONFLICT (patient_id) DO UPDATE SET "
                      "name = EXCLUDED.name RETURNING id"
                  )
                  sid = await conn.fetchval(
                      "INSERT INTO studies (patient_id, study_id, description, "
                      "study_instance_uid, study_status) VALUES ($1, "
                      "'E2E-STUDY-001', 'E2E fixture study', "
                      "'1.2.826.0.1.3680043.8.498.20260810-e2e-study-001', "
                      "'complete') ON CONFLICT (patient_id, study_id) DO UPDATE "
                      "SET study_status = EXCLUDED.study_status RETURNING id",
                      pid,
                  )
                  ser = await conn.fetchval(
                      "INSERT INTO series (study_id, number, modality, "
                      "description, series_instance_uid) VALUES ($1, '1', 'CT', "
                      "'E2E fixture series', "
                      "'1.2.826.0.1.3680043.8.498.20260810-e2e-series-001') "
                      "ON CONFLICT (study_id, number) DO UPDATE SET "
                      "modality = EXCLUDED.modality RETURNING id",
                      sid,
                  )
                  fid = await conn.fetchval(
                      "INSERT INTO files (patient_id, study_id, series_id, "
                      "name, hash, sop_instance_uid, sop_class_uid, size, "
                      "indexed, meta) VALUES ($1, $2, $3, "
                      "'E2E-FIXTURE-CT-001.dcm', 'e2e-fixture-hash-001', $4, "
                      "'1.2.840.10008.5.1.4.1.1.2', 1024, false, '{}'::jsonb) "
                      "RETURNING id",
                      pid,
                      sid,
                      ser,
                      sop,
                  )
                  print(f"seeded e2e fixture file id={fid}")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
      - name: Start backend
        run: |
          cd backend
          nohup uvicorn app:app --host 0.0.0.0 --port 8080 >/tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "backend healthy (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          tail -100 /tmp/backend.log
          exit 1
      - name: Install browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      # The playwright webServer block starts the vite dev server (which
      # proxies /api to :8080) and waits for it on port 5173.
      - run: cd frontend && npx playwright test --project=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
  requirements-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate requirements packages
        run: |
          for slug in super-admin tenant-admin service-director service-coordinator qa-team technologist technician front-desk cashier biomedical-engineer nursing staff-radiologist resident referring-clinician external-ris external-emr external-pacs teleradiologist hospital-staff; do
            bash scripts/validate-requirements.sh "$slug" >/dev/null || { echo "FAILED: $slug"; exit 1; }
          done
          echo "All 19 requirements packages PASS"
  build-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci && npm run build
      - run: cd frontend && node scripts/check-bundle-size.mjs
      - run: cd frontend && npx vitest run --coverage
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantumpacs-backend backend/
      - run: docker build -t quantumpacs-frontend frontend/
  # (D-M11) The compose stack is the prod-like runtime (the QUANTUMPACS_DOCKER
  # config branch); smoke-test it end-to-end so the images actually run.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
        env:
          POSTGRES_PASSWORD: quantumpacs-ci-smoke-db-pass
          SECRET: quantumpacs-ci-smoke-secret-not-for-any-prod
          SUPERADMIN_PASS: quantumpacs-ci-smoke-superadmin-not-for-any-prod
      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then
              echo "backend healthy (attempt $i)"
              curl -sf http://localhost:8080/api/health
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose logs --tail 100 backend postgres elasticsearch redis
          exit 1
      - run: docker compose down -v
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: 'fs', scan-ref: 'backend/', format: 'table' }
