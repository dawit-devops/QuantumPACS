name: CI

on:
  push:
    branches: [main, v3-dev, phase/**]
  pull_request:
    branches: [main, v3-dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npx prettier --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps && npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantumpacs
          POSTGRES_PASSWORD: pa55w0rd
          POSTGRES_DB: quantumpacs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests/ -q
        env:
          DB_HOST: localhost
          DB_USER: quantumpacs
          DB_PASSWORD: pa55w0rd
          DB_NAME: quantumpacs

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps && npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          tags: quantumpacs-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: quantumpacs-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: quantumpacs-full:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (for scan)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          tags: quantumpacs-backend:scan
          load: true
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quantumpacs-backend:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL