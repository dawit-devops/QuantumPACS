name: Lint & Security

# PRs to main/v3-dev already cover feature branches — direct pushes to
# phase/** ran this suite twice per PR.
on:
  push:
    branches: [main, v3-dev]
  pull_request:
    branches: [main, v3-dev]

concurrency:
  group: sec-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
