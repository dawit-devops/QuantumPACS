<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" role="img" aria-labelledby="t1l d1l">
  <title id="t1l">QuantumPACS — The Slice concept, horizontal lockup</title>
  <desc id="d1l">Scan-plane aperture mark with the QuantumPACS wordmark.</desc>
  <defs>
    <linearGradient id="g1l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0077B6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <g id="icon" transform="translate(8,8)">
    <rect x="0" y="0" width="64" height="64" rx="13" fill="none" stroke="url(#g1l)" stroke-width="5"/>
    <line x1="32" y1="14" x2="32" y2="50" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="25" y2="6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="39" y1="0" x2="39" y2="6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="6" fill="url(#g1l)"/>
  </g>
  <text x="90" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#1E293B">
    Quantum<tspan fill="#0E7490">PACS</tspan>
  </text>
</svg>
