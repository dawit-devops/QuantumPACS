<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-labelledby="t d">
  <title id="t">QuantumPACS — Orbit favicon</title>
  <desc id="d">Simplified Orbit mark for browser tabs and small contexts — outer ring, axis ticks, and nucleus.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0077B6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- outer orbit ring -->
  <circle cx="20" cy="20" r="13.5" fill="none" stroke="url(#g)" stroke-width="2.6"/>
  <!-- axis ticks contained inside the ring -->
  <line x1="20" y1="4.5" x2="20" y2="9" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="20" y2="35.5" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- nucleus -->
  <circle cx="20" cy="20" r="2.8" fill="url(#g)"/>
</svg>
