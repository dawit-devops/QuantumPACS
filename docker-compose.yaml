services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: openpacs-postgres:16
    container_name: openpacs-postgres-1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openpacs
      POSTGRES_PASSWORD: pa55w0rd
      POSTGRES_DB: openpacs
    volumes:
      - openpacs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpacs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openpacs_pgdata:
