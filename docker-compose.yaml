services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: quantumpacs-postgres:16
    container_name: quantumpacs-postgres-1
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantumpacs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pa55w0rd}
      POSTGRES_DB: ${POSTGRES_DB:-quantumpacs}
    volumes:
      - quantumpacs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantumpacs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quantumpacs-redis-1
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - quantumpacs_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quantumpacs-backend:latest
    container_name: quantumpacs-backend-1
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      QUANTUMPACS_DOCKER: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-quantumpacs}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pa55w0rd}
      DB_NAME: ${POSTGRES_DB:-quantumpacs}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SECRET: ${SECRET:-compose-dev-secret-replace-in-production-32b!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quantumpacs-frontend:latest
    container_name: quantumpacs-frontend-1
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      BACKEND_HOST: backend:8080
    depends_on:
      - backend

volumes:
  quantumpacs_pgdata:
  quantumpacs_redisdata: