services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    container_name: quantumpacs-es-1
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=quantumpacs
      - node.name=quantumpacs-es-1
      - network.host=0.0.0.0
      - http.host=0.0.0.0
      - indices.memory.index_buffer_size=10%
      - indices.fielddata.cache.size=20%
      - thread_pool.search.queue_size=100
    volumes:
      - quantumpacs_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 1g
    mem_reservation: 512m

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: quantumpacs-postgres:16
    container_name: quantumpacs-postgres-1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantumpacs}
      # Override via .env — never commit real credentials to this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantumpacs-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-quantumpacs}
    volumes:
      - quantumpacs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantumpacs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # App stack (backend + frontend). Opt-in via --profile app so the dev
  # workflow (systemd units for apps, compose only for postgres/es) is
  # unchanged. Production/CI uses: docker compose --profile app up -d.
  backend:
    build:
      context: ./backend
    image: quantumpacs-backend:${IMAGE_TAG:-latest}
    container_name: quantumpacs-backend-1
    restart: unless-stopped
    profiles: ["app"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-quantumpacs}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-quantumpacs-local-dev-only}
      DB_DATABASE: ${POSTGRES_DB:-quantumpacs}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SECRET: ${QUANTUMPACS_SECRET:-quantumpacs-compose-secret-change-me}
      SUPERADMIN_PASS: ${SUPERADMIN_PASS:-pa55w0rd}
      SEED_RBAC_PASSWORD: ${SEED_RBAC_PASSWORD:-pa55w0rd}
      QUANTUMPACS_DOCKER: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: quantumpacs-frontend:${IMAGE_TAG:-latest}
    container_name: quantumpacs-frontend-1
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_started

volumes:
  quantumpacs_pgdata:
  quantumpacs_esdata:
