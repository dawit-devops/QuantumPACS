repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/
        types_or: [javascript, jsx, typescript, tsx, css, json]

  - repo: local
    hooks:
      - id: no-direct-push-to-protected
        name: Prevent direct push to main/v3-dev
        entry: sh -c '! git rev-parse --abbrev-ref HEAD | grep -qE "^(main|v3-dev)$"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: tsc
        name: TypeScript type check
        entry: sh -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: pytest
        name: Python tests
        entry: sh -c 'cd backend && venv/bin/python -m pytest tests/ -q'
        language: system
        files: ^backend/
        pass_filenames: false
