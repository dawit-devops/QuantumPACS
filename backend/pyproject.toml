[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 300
timeout_method = "thread"
markers = [
    "perf: performance/concurrency gates (S12-01..07) — soft thresholds, CI-tolerant",
]
filterwarnings = [
    "ignore::UserWarning:jwt.warnings",
    'ignore:Using `httpx` with `starlette.testclient`:UserWarning',
    # ResourceWarnings are no longer swallowed wholesale: leaking sockets,
    # transports or unawaited coroutines fail the suite instead (M6).
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use sys.modules mocks before imports (E402) and compact one-liners (E701/E702)
"tests/**" = ["E402", "E701", "E702"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    "venv/*",
    ".venv/*",
]

[tool.coverage.report]
# M4: CI runs pytest --cov and fails below this floor (measured 73% on the
# full suite, 2026-08-10 — 70 leaves a 3-point buffer for runner variance).
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"
