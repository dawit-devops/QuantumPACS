services:
  postgres:
    build:
      context: ../docker/postgres
      dockerfile: Dockerfile
    image: quantumpacs-postgres:18
    container_name: quantumpacs-postgres-1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantumpacs
      POSTGRES_PASSWORD: pa55w0rd
      POSTGRES_DB: quantumpacs
    volumes:
      # PG18+ single-mount convention (see docker-compose.yaml).
      - quantumpacs_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumpacs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quantumpacs_pgdata:
